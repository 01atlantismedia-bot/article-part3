</style></head><body>
<header><div class="hd"><div class="logo">Akmal<i>.</i><small>Vocabulary class</small></div><nav id="nav"></nav><div id="hud"></div><div class="tools"><button class="btn alt sm" data-act="themebtn" aria-label="Change theme">🎨 Theme</button><div id="thm" hidden></div></div><button class="btn alt sm" id="so" data-act="out" hidden>Sign out</button></div></header>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="PASTE_YOUR_PROJECT_URL",SUPABASE_KEY="PASTE_YOUR_ANON_PUBLIC_KEY";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BRAND="Akmal speaking materials";
const SEED=[["financially material", "phrase", "large enough in money terms to affect a decision or a company’s results", "The auditors ignored the error because it was not financially material.", "Recent"], ["it is incumbent upon", "phrase", "it is someone’s duty or responsibility to do something", "It is incumbent upon governments to protect vulnerable citizens.", "Recent"], ["Faustian bargain", "phrase", "a deal where you gain something now but pay a terrible price later", "Cheap coal power turned out to be a Faustian bargain for the climate.", "Recent"], ["equilibrium", "noun", "a state of balance between opposing forces", "Prices settle at equilibrium when supply meets demand.", "Recent"], ["surplus", "noun", "an amount left over; more than is needed", "The farm sold its surplus grain abroad.", "Recent"], ["price elasticity", "noun", "how much demand changes when the price changes", "Luxury goods usually have high price elasticity.", "Recent"], ["stranded assets", "phrase", "investments that lose their value early, for example because of new laws or technology", "Oil reserves may become stranded assets as the world turns to clean energy.", "Recent"], ["litigation", "noun", "the process of taking a dispute to court", "The company settled to avoid years of costly litigation.", "Recent"], ["collating evidence", "phrase", "gathering and organising information from different sources so it can be compared", "The team spent weeks collating evidence before the trial.", "Recent"], ["give a good account of oneself", "phrase", "to perform well and make a good impression, especially in a hard situation", "She gave a good account of herself in the final interview.", "Recent"], ["have agency over yourself", "phrase", "to be able to make your own choices and control your own life", "Education helps people have agency over themselves.", "Recent"], ["conducive", "adjective", "making a particular result easy or likely to happen", "A quiet room is conducive to concentration.", "Recent"], ["rehabilitate", "verb", "to help someone return to a healthy, normal life, especially after prison", "", "Crime & Justice"], ["recidivism", "noun", "the tendency of a convicted person to commit crime again", "", "Crime & Justice"], ["deterrent", "noun", "something that discourages people from acting by making them fear the consequences", "", "Crime & Justice"], ["retribution", "noun", "punishment given as payback for a wrongdoing", "", "Crime & Justice"], ["lenient", "adjective", "less strict or severe than expected", "", "Crime & Justice"], ["incarcerate", "verb", "to put someone in prison", "", "Crime & Justice"], ["remorse", "noun", "deep regret for something wrong you have done", "", "Crime & Justice"], ["reintegrate", "verb", "to bring someone back into a community or society after time away", "", "Crime & Justice"], ["proportionate", "adjective", "matched in size or seriousness to something else", "", "Crime & Justice"], ["root cause", "noun", "the original, underlying reason for a problem", "", "Crime & Justice"], ["compensation", "noun", "something given to make up for loss or harm", "", "Crime & Justice"], ["overcrowded", "adjective", "holding more people than there is space or resources for", "", "Crime & Justice"], ["tuition", "", "the money you pay for teaching at a school or university", "", "Education"], ["subsidy", "", "money from the government that makes something cheaper for buyers", "", "Education"], ["enrolment", "", "the act of signing up to join a course or university", "", "Education"], ["graduate", "", "a person who has completed a degree", "", "Education"], ["debt", "", "money you owe and must pay back", "", "Education"], ["equity", "", "fairness, where everyone gets a real chance", "", "Education"], ["taxpayer", "", "a person who pays money to the government as tax", "", "Education"], ["credential", "", "a qualification or certificate that proves what you know", "", "Education"], ["scholarship", "", "money given to a student to pay for study, often for good grades or need", "", "Education"], ["workforce", "", "all the people who work in a country or company", "", "Education"], ["productivity", "", "how much work or value is produced in a set time", "", "Education"], ["afford", "", "to have enough money to pay for something", "", "Education"], ["burden", "", "a heavy load or responsibility, often financial", "", "Education"], ["regressive", "", "helping richer people more than poorer people", "", "Education"], ["targeted", "", "aimed at one particular group", "", "Education"], ["barrier", "", "something that stops you from doing or reaching something", "", "Education"], ["mobility", "", "the ability to move up in society, or to move to another place", "", "Education"], ["entrepreneur", "", "a person who starts their own business", "", "Education"], ["inflation", "", "a rise in prices, or in the level of qualification needed for the same job", "", "Education"], ["budget", "", "a plan for how money will be earned and spent", "", "Education"]];
const RANKS=[["Beginner",0],["Collector",60],["Wordsmith",180],["Lexicographer",380],["Orator",700],["Sage",1200]];
const THEMES=[["night","Night","#0f1520"],["paper","Paper","#f6f4ee"],["sepia","Sepia","#efe3cc"],["forest","Forest","#0d1a13"],["contrast","High contrast","#000"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dstr=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const dd=(a,b)=>Math.round((new Date(a+"T00:00")-new Date(b+"T00:00"))/864e5);
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const blank0=()=>({xp:0,streak:0,best:0,last:"",answers:0,quizzes:0,perfects:0,mastery:{},days:{}});
const norm=r=>({...blank0(),...r,id:r.user_id,last:r.last_day||"",mastery:r.mastery||{},days:r.days||{}});
let me=null,isT=false,words=[],pf={},all=[],prog=blank0(),tab="review",cur="all",sess=null,qz=null,lb="xp",live=false,chan=null,msg="";
const byId=id=>words.find(w=>w.id===id);
const nmOf=id=>esc((pf[id]&&pf[id].name)||"Student");
const mastered=p=>words.filter(w=>((p.mastery||{})[w.id]||0)>=3).length;
const bx=w=>prog.mastery[w.id]||0,setbx=(w,v)=>{prog.mastery[w.id]=v};
const pool=()=>words.filter(w=>cur==="all"||w.set_name===cur);
const rk=x=>{let i=0;RANKS.forEach((r,j)=>{if(x>=r[1])i=j});return i};
const eff=p=>p.last&&dd(dstr(),p.last)<=1?p.streak:0;

/* ---- saving ---- */
let st=null;
function saveP(){if(isT)return;clearTimeout(st);st=setTimeout(flush,700)}
async function flush(){
  if(isT||!me)return;
  const i=all.findIndex(x=>x.id===me.id),r={...prog,id:me.id,user_id:me.id};if(i<0)all.push(r);else all[i]=r;
  await sb.from("progress").upsert({user_id:me.id,xp:prog.xp,streak:prog.streak,best:prog.best,last_day:prog.last||null,answers:prog.answers,quizzes:prog.quizzes,perfects:prog.perfects,mastery:prog.mastery,days:prog.days});
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
function touch(ok){
  const t=dstr();
  if(prog.last!==t){prog.streak=(prog.last&&dd(t,prog.last)===1)?prog.streak+1:1;prog.best=Math.max(prog.best,prog.streak);prog.last=t}
  const d=prog.days[t]||{n:0,c:0};d.n++;if(ok)d.c++;prog.days[t]=d;prog.answers++;
  for(const k in prog.days)if(dd(t,k)>45)delete prog.days[k];
  saveP();
}
function toast(m){const o=$("#gt");if(o)o.remove();const e=document.createElement("div");e.id="gt";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1600)}
function party(){const C=["var(--ac)","var(--hv)","var(--pro)","var(--con)"];for(let i=0;i<46;i++){const p=document.createElement("i");p.className="cf";p.style.cssText="left:"+Math.random()*100+"vw;background:"+C[i%4]+";animation-delay:"+Math.random()*.5+"s";document.body.appendChild(p);setTimeout(()=>p.remove(),3200)}}
function award(n,why){const b=rk(prog.xp);prog.xp+=n;saveP();toast("+"+n+" XP"+(why?" · "+why:""));const a=rk(prog.xp);if(a>b)setTimeout(()=>{toast("Rank up: "+RANKS[a][0]+"!");party()},1300)}

/* ---- boot, data, realtime ---- */
sb.auth.getSession().then(({data})=>{me=data.session&&data.session.user;boot()});
async function boot(){if(!me){authView();return}await load();mvLoad();subscribe();render()}
async function load(){
  const [a,b,c]=await Promise.all([sb.from("words").select("*").order("id"),sb.from("profiles").select("*"),sb.from("progress").select("*")]);
  words=a.data||[];pf=Object.fromEntries((b.data||[]).map(x=>[x.id,x]));all=(c.data||[]).map(norm);
  isT=!!(pf[me.id]&&pf[me.id].role==="teacher");
  if(!isT)prog=Object.assign(blank0(),all.find(p=>p.id===me.id)||{});
  tab=isT?"students":"review";
}
function subscribe(){
  if(chan)return;
  const lr=()=>{if(tab==="board"||tab==="students")render()};
  chan=sb.channel("live")
   .on("postgres_changes",{event:"*",schema:"public",table:"progress"},p=>{
      if(p.eventType==="DELETE")all=all.filter(x=>x.id!==p.old.user_id);
      else if(p.new&&p.new.user_id!==me.id){const r=norm(p.new),i=all.findIndex(x=>x.id===r.id);if(i<0)all.push(r);else all[i]=r}
      lr()})
   .on("postgres_changes",{event:"*",schema:"public",table:"words"},async()=>{const a=await sb.from("words").select("*").order("id");words=a.data||[];if(tab==="words")$("#wl").innerHTML=wl();else lr()})
   .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},async()=>{const b=await sb.from("profiles").select("*");pf=Object.fromEntries((b.data||[]).map(x=>[x.id,x]));lr()})
   .subscribe(s=>{live=s==="SUBSCRIBED";if(tab==="board")render()});
}

/* ---- views ---- */
function authView(){const f0=$("#ielts");if(f0){f0.hidden=true;f0.dataset.k="";f0.srcdoc=""}$("footer").hidden=false;
  $("#nav").innerHTML="";$("#hud").innerHTML="";$("#so").hidden=true;
  $("#app").innerHTML='<h1>Welcome</h1><p class="sub">Sign in, or create an account with your name.</p><div class="card" style="max-width:420px"><input id="anm" style="width:100%;margin-bottom:8px" placeholder="Your name (new accounts only)"><input id="aem" type="email" style="width:100%;margin-bottom:8px" placeholder="Email"><input id="apw" type="password" style="width:100%;margin-bottom:8px" placeholder="Password (6+ characters)"><p class="mut" style="color:var(--con)">'+esc(msg)+'</p><div class="row"><button class="btn grow" data-act="signin">Sign in</button><button class="btn alt grow" data-act="signup">Create account</button></div></div>';
}
function render(){
  if(!me)return authView();
  const tabs=isT?[["students","Students"],["ielts","IELTS"],["board","Liveboard"],["words","Words"]]:[["review","Review"],["quiz","Quiz"],["ielts","IELTS"],["mine","My words"],["board","Liveboard"],["words","Words"]];
  if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
  $("#so").hidden=false;
  $("#nav").innerHTML=tabs.map(t=>'<button class="'+(tab===t[0]?"on":"")+'" data-act="tab" data-t="'+t[0]+'">'+t[1]+"</button>").join("");
  hud();
  $("#app").innerHTML=({review:vReview,quiz:vQuiz,ielts:vIelts,mine:vMine,board:vBoard,words:vWords,students:vStudents})[tab]();ieShow();
}
function hud(){
  if(isT){$("#hud").innerHTML='<div class="hudb">Teacher · '+nmOf(me.id)+"</div>";return}
  const i=rk(prog.xp),a=RANKS[i][1],n=RANKS[i+1],p=n?(prog.xp-a)/(n[1]-a)*100:100;
  $("#hud").innerHTML='<div class="hudb">🔥 '+eff(prog)+" · "+RANKS[i][0]+' <span class="pb hp"><i style="width:'+p+'%"></i></span> '+prog.xp+" XP</div>";
}
function setSel(){const S=[...new Set(words.map(w=>w.set_name))];return '<select id="setsel"><option value="all">All sets ('+words.length+")</option>"+S.map(s=>'<option value="'+esc(s)+'"'+(cur===s?" selected":"")+">"+esc(s)+" ("+words.filter(w=>w.set_name===s).length+")</option>").join("")+"</select>"}
function vReview(){

function blank(w){const i=w.ex.toLowerCase().indexOf(w.w.toLowerCase());return esc(w.ex.slice(0,i))+"_____"+esc(w.ex.slice(i+w.w.length))}
function mkQ(w){
  const fill=!!w.ex&&w.ex.toLowerCase().includes(w.w.toLowerCase())&&Math.random()<.5;
  const o=words.filter(x=>x.id!==w.id&&x.w!==w.w),ds=shuf(o.filter(x=>x.pos===w.pos)).concat(shuf(o.filter(x=>x.pos!==w.pos))).slice(0,3);
  return{w,fill,opts:shuf([w,...ds])};
}

function vStudents(){
  const t0=dstr(),days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())});
  const have=new Set(all.map(p=>p.id));
  const rows=[...all,...Object.values(pf).filter(x=>!have.has(x.id)).map(x=>({...blank0(),id:x.id}))].filter(p=>(pf[p.id]||{}).role!=="teacher").sort((a,b)=>(a.last||"").localeCompare(b.last||""));
  const act=rows.filter(p=>p.last===t0).length,idle=rows.filter(p=>!p.last||dd(t0,p.last)>=3).length;
  let h='<h1>Students</h1><div class="stats"><div class="card"><b>'+rows.length+'</b><span>students</span></div><div class="card"><b style="color:var(--pro)">'+act+'</b><span>active today</span></div><div class="card"><b style="color:var(--con)">'+idle+'</b><span>inactive 3+ days</span></div></div>';
  if(!rows.length)return h+'<div class="card mut">No students yet. Share the link; they appear here as soon as they sign up.</div>';
  rows.forEach(p=>{
    let c=0,n=0,wk=0;for(const k in p.days){c+=p.days[k].c;n+=p.days[k].n;if(dd(t0,k)<7)wk+=p.days[k].n}
    const g=p.last?dd(t0,p.last):null,s=g===null?["Never started","n"]:g===0?["Active today","g"]:g===1?["Yesterday","y"]:["Inactive "+g+" days","r"];

  return h+'<p class="mut">Squares show the last 14 days, oldest on the left. Green means the student practised that day.</p>';

async function addRows(R){const {error}=await sb.from("words").insert(R);if(error)return toast(error.message);const a=await sb.from("words").select("*").order("id");words=a.data||[];toast(R.length+" words sent");render()}
function rate(ok){
  const w=byId(sess.q[sess.i]);setbx(w,ok?Math.min(3,bx(w)+1):Math.max(0,bx(w)-1));if(ok)sess.k++;
  touch(ok);award(ok?2:1);sess.i++;sess.flip=false;
  if(sess.i>=sess.q.length){prog.quizzes++;award(10,"session complete");party()}

/* ---- MY WORDS: personal vocab trainer (saved per student, on this device) ---- */
let mv=[],mvMode="home",ms=null,mq=null,drag=null,justDragged=false;
const mvKey=()=>"myvocab_"+(me?me.id:"x");
function mvLoad(){try{mv=JSON.parse(localStorage.getItem(mvKey()))||[]}catch(e){mv=[]}}
function mvSave(){try{localStorage.setItem(mvKey(),JSON.stringify(mv))}catch(e){}}
/* Call this from your highlight feature: addToMyVocab({w:"word",d:"meaning",ex:"sentence"}) */
function addToMyVocab(o){
  const w=String((o&&o.w)||"").trim();
  if(!w||isT||!me)return false;
  if(mv.some(x=>x.w.toLowerCase()===w.toLowerCase())){toast("Already in My words");return false}
  mv.unshift({id:Date.now()+Math.random(),w:w,d:String(o.d||"").trim(),ex:String(o.ex||"").trim(),box:0});
  mvSave();toast("Saved to My words");
  if(tab==="mine"){const y=scrollY;render();scrollTo(0,y)}
  return true;
}
window.addToMyVocab=addToMyVocab;

function mvDots(w){return '<span class="dots4">'+[0,1,2].map(i=>'<span class="'+(w.box>i?"on":"")+'"></span>').join("")+"</span>"}
function mvStats(){
  const n=mv.length,l=mv.filter(x=>x.box>=3).length;
  return '<div class="stats"><div class="card"><b>'+n+'</b><span>saved words</span></div><div class="card"><b>'+l+'</b><span>learned</span></div><div class="card"><b>'+(n-l)+'</b><span>still learning</span></div></div>';
}
function vMine(){
  if(mvMode==="swipe"&&ms)return mvSwipeV();
  if(mvMode==="quiz"&&mq)return mvQuizV();
  return "<h1>My words</h1>"+
  '<p class="sub">Words you highlight or add yourself. Swipe through them, or take a quiz.</p>'+mvStats()+
  '<div class="bar"><button class="btn" data-mv="swipe">Swipe cards</button><button class="btn alt" data-mv="quiz">Quiz me</button></div>'+
  '<div class="card"><h3>Add a word</h3>'+
  '<input id="mvw" style="width:100%;margin-bottom:8px" placeholder="Word or phrase">'+
  '<input id="mvd" style="width:100%;margin-bottom:8px" placeholder="Meaning (needed for the quiz)">'+
  '<input id="mvx" style="width:100%;margin-bottom:10px" placeholder="Example sentence (optional)">'+
  '<button class="btn" data-mv="add">Add word</button></div>'+
  '<h2>Saved words</h2><div class="card">'+mvList()+"</div>";
}
function mvList(){
  if(!mv.length)return '<p class="mut">Nothing saved yet. Add a word above, or tap “＋ My words” on any word in the Words tab.</p>';
  return mv.map(w=>'<div class="vi" style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row" style="margin:0"><b>'+esc(w.w)+'</b><span class="grow"></span>'+mvDots(w)+
  '<button class="ghost" data-mv="edit" data-id="'+w.id+'" aria-label="Edit meaning">✎</button><button class="ghost" data-mv="del" data-id="'+w.id+'" aria-label="Delete word">✕</button></div>'+
  "<div>"+(w.d?esc(w.d):'<span class="mut">No meaning yet. Tap ✎ to add one.</span>')+"</div>"+(w.ex?'<div class="mut"><i>'+esc(w.ex)+"</i></div>":"")+"</div>").join("");

/* swipe cards */
function mvSwipeV(){
  if(ms.i>=ms.q.length)
    return "<h1>Swipe cards</h1>"+'<div class="card" style="text-align:center"><h3>Round complete</h3><p>You knew <b>'+ms.k+"</b> of "+ms.q.length+' cards.</p></div><div class="bar"><button class="btn" data-mv="swipe">Another round</button><button class="btn alt" data-mv="home">Back</button></div>';
  const w=mv.find(x=>x.id===ms.q[ms.i])||{w:"",d:"",ex:""};
  return '<div class="pb"><i style="width:'+ms.i/ms.q.length*100+'%"></i></div><p class="mut">Card '+(ms.i+1)+" of "+ms.q.length+' · swipe right if you know it, left if you don’t</p>'+
  '<div id="sw" class="card fc" data-mv="flip" style="touch-action:pan-y">'+
  '<div class="w">'+esc(w.w)+"</div>"+
  (ms.flip?"<p>"+(w.d?esc(w.d):'<span class="mut">No meaning saved yet</span>')+"</p>"+(w.ex?'<p class="mut"><i>'+esc(w.ex)+"</i></p>":""):'<p class="mut">Tap to see the meaning</p>')+"</div>"+
  '<div class="row"><button class="btn alt grow" data-mv="no">✕ Don’t know</button><button class="btn grow" data-mv="yes">✓ I know it</button></div><button class="ghost" data-mv="home">Stop</button>';
}
function mvRate(ok){
  if(!ms||ms.i>=ms.q.length)return;
  const w=mv.find(x=>x.id===ms.q[ms.i]);
  if(w){w.box=ok?Math.min(3,w.box+1):Math.max(0,w.box-1);mvSave();touch(ok)}
  if(ok)ms.k++;
  ms.i++;ms.flip=false;render();
}
/* quiz */
function mkMQ(w){
  const fill=!!w.ex&&w.ex.toLowerCase().includes(w.w.toLowerCase())&&Math.random()<.5;
  const mine=shuf(mv.filter(x=>x.id!==w.id&&x.d)),cls=shuf(words),seen=new Set([w.w.toLowerCase()]),ds=[];
  for(const x of mine.concat(cls)){const k=x.w.toLowerCase();if(!seen.has(k)){seen.add(k);ds.push({id:x.id,w:x.w})}if(ds.length>=3)break}
  return{w:w,fill:fill,opts:shuf([{id:w.id,w:w.w}].concat(ds))};
}
function mvQuizV(){
  if(!mq.done){
    const q=mq.qs[mq.i],w=q.w,s=mq.sel;
    return '<div class="gbox"><div class="row"><span class="mut">Question '+(mq.i+1)+" of "+mq.qs.length+'</span><span class="grow"></span><span class="mut">'+mq.c+' correct</span></div><div class="pb"><i style="width:'+mq.i/mq.qs.length*100+'%"></i></div><div class="gq">'+(q.fill?"Which word or phrase fits the gap?<br><i>"+blank(w)+"</i>":"Which word means: <i>"+esc(w.d)+"</i>?")+"</div>"+
    q.opts.map((o,k)=>'<button class="btn alt gopt '+(s==null?"":o.id===w.id?"ok":k===s?"no":"")+'" data-mv="ans" data-k="'+k+'" '+(s!=null?"disabled":"")+">"+esc(o.w)+"</button>").join("")+
    (s!=null?'<p class="mut">'+(q.opts[s].id===w.id?"✅ Correct. ":"❌ It was <b>"+esc(w.w)+"</b>. ")+esc(w.d)+'</p><button class="btn" data-mv="qnext">'+(mq.i+1<mq.qs.length?"Next":"Finish")+"</button>":"")+"</div>";
  }
  const s3=mq.c===mq.qs.length?3:mq.c/mq.qs.length>=.7?2:mq.c/mq.qs.length>=.4?1:0;
  return "<h1>My quiz</h1>"+'<div class="card" style="text-align:center"><div class="gstar">'+"★".repeat(s3)+'<span style="opacity:.25">'+"★".repeat(3-s3)+"</span></div><h3>"+mq.c+" / "+mq.qs.length+"</h3></div>"+
  '<div class="bar"><button class="btn" data-mv="quiz">Play again</button><button class="btn alt" data-mv="home">Back</button></div>';
}
/* swipe gesture */
document.addEventListener("pointerdown",e=>{const c=e.target.closest("#sw");if(!c)return;drag={x:e.clientX,dx:0,c:c,moved:false}});
document.addEventListener("pointermove",e=>{
  if(!drag)return;
  drag.dx=e.clientX-drag.x;if(Math.abs(drag.dx)>8)drag.moved=true;
  if(drag.moved){drag.c.style.transition="none";drag.c.style.transform="translateX("+drag.dx+"px) rotate("+drag.dx/25+"deg)";drag.c.style.boxShadow=Math.abs(drag.dx)>40?"0 0 0 3px "+(drag.dx>0?"var(--pro)":"var(--con)"):""}
});
function mvDrop(){
  if(!drag)return;const d=drag;drag=null;
  if(d.moved){justDragged=true;setTimeout(()=>{justDragged=false},80)}
  if(Math.abs(d.dx)>90){d.c.style.transition="transform .18s";d.c.style.transform="translateX("+(d.dx>0?600:-600)+"px)";setTimeout(()=>mvRate(d.dx>0),170)}
  else{d.c.style.transition="transform .2s";d.c.style.transform="";d.c.style.boxShadow=""}
}
document.addEventListener("pointerup",mvDrop);document.addEventListener("pointercancel",mvDrop);
/* clicks for My words */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-mv]");if(!b)return;
  const a=b.dataset.mv;
  if(a==="flip"){if(justDragged||!ms)return;ms.flip=!ms.flip;render();return}
  if(a==="add"){
    const w=$("#mvw").value.trim();if(!w)return toast("Type a word first");
    const ok=addToMyVocab({w:w,d:$("#mvd").value,ex:$("#mvx").value});
    if(ok&&tab==="mine"){const f=$("#mvw");if(f)f.focus()}
    return;
  }
  if(a==="save"){const w=byId(+b.dataset.id);if(w)addToMyVocab({w:w.w,d:w.d,ex:w.ex});return}
  if(a==="home"){mvMode="home";ms=mq=null;render();return}
  if(a==="swipe"){
    if(!mv.length)return toast("Add some words first");
    mvMode="swipe";ms={q:mv.slice().sort((x,y)=>(x.box-y.box)+(Math.random()-.5)*1.5).slice(0,20).map(x=>x.id),i:0,k:0,flip:false};render();return;
  }
  if(a==="yes"){mvRate(true);return}
  if(a==="no"){mvRate(false);return}
  if(a==="quiz"){
    const Q=mv.filter(x=>x.d);
    if(!Q.length)return toast("Add words with a meaning first");
    const qs=Q.slice().sort((x,y)=>(x.box-y.box)+(Math.random()-.5)*1.5).slice(0,10).map(mkMQ);
    if(qs[0].opts.length<2)return toast("Add at least 2 words first");
    mvMode="quiz";mq={qs:qs,i:0,c:0,sel:null,done:false};render();return;
  }
  if(a==="ans"){
    if(mq.sel!=null)return;
    const k=+b.dataset.k,q=mq.qs[mq.i],ok=q.opts[k].id===q.w.id,w=mv.find(x=>x.id===q.w.id);
    mq.sel=k;if(ok)mq.c++;
    if(w){w.box=ok?Math.min(3,w.box+1):Math.max(0,w.box-1);mvSave()}
    touch(ok);render();return;
  }
  if(a==="qnext"){mq.sel=null;mq.i++;if(mq.i>=mq.qs.length)mq.done=true;render();return}
  if(a==="del"){mv=mv.filter(x=>String(x.id)!==b.dataset.id);mvSave();render();return}
  if(a==="edit"){
    const w=mv.find(x=>String(x.id)===b.dataset.id);if(!w)return;
    const d=prompt("Meaning of \""+w.w+"\":",w.d);
    if(d!==null){w.d=d.trim();mvSave();render()}
  }

    const em=$("#aem").value.trim(),pw=$("#apw").value,nm=$("#anm").value.trim();
    if(a==="signup"&&!nm){msg="Please enter your name.";return authView()}
    const r=a==="signin"?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw,options:{data:{name:nm}}});
    if(r.error){msg=r.error.message;return authView()}
    if(!r.data.session){msg="Check your email to confirm your account, then sign in.";return authView()}
    me=r.data.user;msg="";boot();return;
  }
  if(a==="out"){await flush();if(chan){sb.removeChannel(chan);chan=null}await sb.auth.signOut();me=null;sess=qz=null;mv=[];mvMode="home";ms=mq=null;prog=blank0();authView();return}
  if(a==="tab"){tab=b.dataset.t;render()}
  else if(a==="lb"){lb=b.dataset.v;render()}
  else if(a==="start"){const P=pool();if(!P.length)return toast("No words yet");sess={q:P.slice().sort((x,y)=>(bx(x)-bx(y))+(Math.random()-.5)*1.5).slice(0,20).map(x=>x.id),i:0,k:0,flip:false};render()}
  else if(a==="flip"){sess.flip=!sess.flip;render()}
  else if(a==="know")rate(true);
  else if(a==="again")rate(false);
  else if(a==="qstart"){const P=pool();if(P.length<2)return toast("Need at least 2 words");qz={qs:P.slice().sort((x,y)=>(bx(x)-bx(y))+(Math.random()-.5)*1.5).slice(0,10).map(mkQ),i:0,c:0,sel:null,done:false};render()}
  else if(a==="ans"){if(qz.sel!=null)return;const k=+b.dataset.k,q=qz.qs[qz.i],ok=q.opts[k].id===q.w.id;qz.sel=k;
    if(ok){qz.c++;setbx(q.w,Math.min(3,bx(q.w)+1));award(5)}else setbx(q.w,Math.max(0,bx(q.w)-1));touch(ok);render()}
  else if(a==="qnext"){qz.sel=null;qz.i++;if(qz.i>=qz.qs.length){qz.done=true;prog.quizzes++;qz.gain=qz.c*5+(qz.c===qz.qs.length?20:0);if(qz.c===qz.qs.length){prog.perfects++;award(20,"perfect");party()}else saveP()}render()}
  else if(a==="del"){const w=byId(+b.dataset.id);if(w&&confirm('Delete "'+w.w+'" for everyone?')){await sb.from("words").delete().eq("id",w.id);words=words.filter(x=>x.id!==w.id);render()}}
  else if(a==="bulk"){const R=$("#bk").value.split("\n").map(l=>l.split("|").map(s=>s.trim())).filter(r=>r[0]&&r[1]).map(r=>({w:r[0],d:r[1],ex:r[2]||"",set_name:r[3]||"My words",pos:"word"}));if(!R.length)return toast("Nothing to send");addRows(R)}
  else if(a==="starter")addRows(SEED.map(s=>({w:s[0],pos:s[1],d:s[2],ex:s[3]||"",set_name:s[4]})));
});
document.addEventListener("change",e=>{if(e.target.id==="setsel"){cur=e.target.value;render()}});
document.addEventListener("input",e=>{if(e.target.dataset.in==="q")$("#wl").innerHTML=wl()});
function themeMenu(){const t=document.documentElement.dataset.theme;$("#thm").innerHTML=THEMES.map(x=>'<button class="'+(t===x[0]?"on":"")+'" data-act="settheme" data-t="'+x[0]+'"><span class="sw2" style="background:'+x[2]+'"></span>'+x[1]+"</button>").join("")}
$("#brand").textContent=BRAND;themeMenu();
</script></body></html>
